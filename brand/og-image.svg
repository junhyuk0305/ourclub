<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="OURCLUB">
  <!-- 링크 미리보기(OG) 이미지: 흰 배경 + 가운데 주황 OC 마크 -->
  <rect width="1200" height="630" fill="#ffffff"/>
  <g transform="translate(360 166) scale(4.138)" fill="none" stroke="#f97316" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <!-- O: 상단에 작은 틈이 있는 링 -->
    <path d="M48.21 13.45 A24 24 0 1 1 31.79 13.45" />
    <!-- C: 오른쪽이 열린 링, O와 겹쳐 인터록 -->
    <path d="M89.77 55.66 A24 24 0 1 1 89.77 16.34" />
  </g>
</svg>
