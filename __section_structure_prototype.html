<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>섹션/그리드 구조 프로토타입</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; background: #e9eef3; color: #111827; }

  .app { display: flex; height: 100vh; }
  .canvas-wrap { flex: 1; overflow-y: auto; padding: 28px; }
  .side { width: 380px; border-left: 2px solid #111; background: #fff; display: flex; flex-direction: column; }
  .side h2 { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: #6b7280; padding: 14px 16px; border-bottom: 1px solid #eee; }
  .side pre { flex: 1; overflow: auto; margin: 0; padding: 16px; font-size: 11px; line-height: 1.55; background: #0e1116; color: #c9d1d9; }
  .legend { padding: 12px 16px; font-size: 12px; border-bottom: 1px solid #eee; line-height: 1.9; }
  .legend b { display:inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: middle; margin-right: 6px; }

  /* 전체 레이아웃 프레임 */
  .frame { max-width: 1000px; margin: 0 auto; background: #fff; border: 1px solid #cbd5e1; box-shadow: 0 8px 30px rgba(0,0,0,.08); min-height: 100%; padding: 16px; }
  .frame-label { font-size: 11px; font-weight: 800; color: #94a3b8; letter-spacing: .08em; margin-bottom: 10px; }

  /* 위젯 (gray box) */
  .widget { background: #d9dde2; border: 1px solid #c2c8cf; border-radius: 6px; padding: 18px 14px; font-size: 13px; font-weight: 700; color: #475569; text-align: center; position: relative; }
  .widget .tag { position:absolute; top:4px; left:6px; font-size:9px; font-weight:800; color:#0ea5e9; }
  .widget .x { position:absolute; top:3px; right:6px; cursor:pointer; color:#94a3b8; font-weight:800; }
  .widget .x:hover { color:#ef4444; }

  /* 섹션 (pink container) */
  .section { background: #f9a8b4; border-radius: 10px; padding: 30px 26px; margin: 14px 0; position: relative; }
  .section > .seclabel { position:absolute; top:8px; left:14px; font-size:11px; font-weight:800; color:#9f1239; }
  .section > .secdel { position:absolute; top:6px; right:12px; cursor:pointer; font-size:11px; font-weight:800; color:#9f1239; opacity:.7; }
  .section > .secdel:hover { opacity:1; }

  /* 행 → 그리드 */
  .row { display: grid; gap: 14px; margin-bottom: 14px; align-items: start; position: relative; }
  .row-tools { display:flex; gap:6px; align-items:center; margin-bottom:8px; }
  .row-tools .lbl { font-size:10px; font-weight:800; color:#9f1239; }

  /* 컬럼 → 위젯 스택 */
  .col { background: rgba(255,255,255,.35); border: 1px dashed rgba(159,18,57,.4); border-radius: 8px; padding: 8px; min-height: 70px; display: flex; flex-direction: column; gap: 8px; }

  /* drag & drop */
  .widget { cursor: grab; }
  .widget.dragging { opacity: .35; }
  .col.dropok { background: rgba(34,197,94,.18); border-color:#16a34a; border-style:solid; }
  .widget.dropbefore { box-shadow: 0 -3px 0 0 #16a34a; }
  .toplevel.dropok, .frame.dropok { outline: 2px dashed #16a34a; outline-offset: 2px; }
  #toplevelDrop { border: 1px dashed #94a3b8; border-radius:6px; padding:10px; text-align:center; font-size:11px; font-weight:700; color:#94a3b8; margin:14px 0; }
  #toplevelDrop.dropok { background: rgba(34,197,94,.15); border-color:#16a34a; color:#16a34a; }

  /* top-level widget (직접 배치) */
  .toplevel { margin: 14px 0; }

  /* buttons */
  button.add { background:#fff; border:1px solid #111; border-radius:6px; padding:6px 10px; font-size:11px; font-weight:800; cursor:pointer; box-shadow:2px 2px 0 0 #111; }
  button.add:hover { background:#fff7ed; }
  button.add:active { box-shadow:none; transform: translate(2px,2px); }
  .plus-col { background: transparent; border: 1px dashed #9f1239; color:#9f1239; border-radius:6px; padding:8px; font-size:12px; font-weight:800; cursor:pointer; }
  .plus-col:hover { background: rgba(255,255,255,.5); }
  .seg { display:inline-flex; border:1px solid #9f1239; border-radius:5px; overflow:hidden; }
  .seg button { border:none; background:#fff; padding:3px 9px; font-size:11px; font-weight:800; cursor:pointer; color:#9f1239; }
  .seg button.on { background:#9f1239; color:#fff; }
  .toolbar { display:flex; gap:8px; flex-wrap:wrap; padding:12px; background:#111; border-radius:8px; margin-bottom:16px; }
  .toolbar button { background:#f9a8b4; border:1px solid #fff; color:#111; }
  .toolbar .hint { color:#9ca3af; font-size:11px; align-self:center; }

  /* widget picker popup */
  .picker { position:fixed; inset:0; background:rgba(0,0,0,.4); display:none; align-items:center; justify-content:center; z-index:100; }
  .picker.open { display:flex; }
  .picker .box { background:#fff; border:2px solid #111; border-radius:8px; padding:16px; width:340px; }
  .picker h3 { font-size:13px; margin-bottom:10px; }
  .picker .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  .picker .grid button { border:1px solid #ddd; border-radius:6px; padding:10px 4px; font-size:11px; font-weight:700; cursor:pointer; background:#fff; }
  .picker .grid button:hover { border-color:#111; background:#fff7ed; }
</style>
</head>
<body>
<div class="app">
  <div class="canvas-wrap">
    <div class="toolbar">
      <button class="add" onclick="addTopWidget()">+ 위젯 (직접 배치)</button>
      <button class="add" onclick="addSection()">+ 섹션</button>
      <span class="hint">위젯을 <b style="color:#f9a8b4">드래그</b>해 옆 컬럼·다른 섹션·맨 아래(직접 배치)로 이동해 보세요. 위젯 위에 놓으면 그 앞에 삽입됩니다.</span>
    </div>
    <div class="frame">
      <div class="frame-label">전체 레이아웃</div>
      <div id="canvas"></div>
    </div>
  </div>

  <div class="side">
    <h2>데이터 구조 (실시간)</h2>
    <div class="legend">
      <div><b style="background:#f9a8b4"></b> 섹션 (배경 + 행들)</div>
      <div><b style="background:#fff;border:1px dashed #9f1239"></b> 컬럼 (위젯 스택, 행당 1~4)</div>
      <div><b style="background:#d9dde2"></b> 위젯 (text/image/stats…)</div>
    </div>
    <pre id="json"></pre>
  </div>
</div>

<div class="picker" id="picker" onclick="if(event.target===this)closePicker()">
  <div class="box">
    <h3>위젯 선택</h3>
    <div class="grid" id="pickerGrid"></div>
  </div>
</div>

<script>
/* ───────────────────────────────────────────────
   명세서 데이터 모델 그대로:
   blocks: (Widget | Section)[]
   Section { type:'section', bgColor, rows: Row[] }
   Row     { cols:1..4, colRatios?, columns: Column[] }
   Column  { widgets: Widget[] }
   Widget  { type, ... }  (section/탭캐러셀은 컬럼 안 금지)
─────────────────────────────────────────────── */
const WIDGET_TYPES = ['텍스트','이미지','통계','멤버','갤러리','버튼','FAQ','타임라인','인용','동영상'];
let uid = 1; const id = () => 'n' + (uid++);

function mkWidget(type){ return { id:id(), type }; }
function mkColumn(){ return { id:id(), widgets:[] }; }
function mkRow(cols, ratios){ return { id:id(), cols, colRatios:ratios||null, columns:Array.from({length:cols}, mkColumn) }; }
function mkSection(){ return { id:id(), type:'section', bgColor:'#f9a8b4', rows:[ mkRow(1) ] }; }

/* ── 첨부 이미지 배치를 미리 시드 ── */
function seed(){
  // 섹션 1: [1열: 큰 위젯 + (행) 2열(왼쪽 큰, 오른쪽 2스택)] → 이미지 윗 섹션
  const s1 = mkSection();
  const r1a = mkRow(2, [2,1]);
  r1a.columns[0].widgets.push(mkWidget('이미지'));
  r1a.columns[1].widgets.push(mkWidget('텍스트'), mkWidget('버튼'));
  const r1b = mkRow(1);
  r1b.columns[0].widgets.push(mkWidget('통계'));
  s1.rows = [r1a, r1b];

  // top-level 위젯 (섹션 밖, 직접 배치) — 이미지의 회색 가로 막대
  const w = mkWidget('갤러리');

  // 섹션 2: 3열 / 1열 / 2열 / 2열(왼1 + 오른4스택)
  const s2 = mkSection();
  const r2a = mkRow(3); r2a.columns.forEach(c=>c.widgets.push(mkWidget('멤버')));
  const r2b = mkRow(1); r2b.columns[0].widgets.push(mkWidget('텍스트'));
  const r2c = mkRow(2); r2c.columns.forEach(c=>c.widgets.push(mkWidget('이미지')));
  const r2d = mkRow(2);
  r2d.columns[0].widgets.push(mkWidget('이미지'));
  r2d.columns[1].widgets.push(mkWidget('FAQ'),mkWidget('FAQ'),mkWidget('FAQ'),mkWidget('FAQ'));
  s2.rows = [r2a, r2b, r2c, r2d];

  return [s1, w, s2];
}

let blocks = seed();

/* ── 픽커 (위젯 추가) ── */
let pickTarget = null; // column 객체
function openPicker(col){ pickTarget = col; const g = document.getElementById('pickerGrid'); g.innerHTML='';
  WIDGET_TYPES.forEach(t=>{ const b=document.createElement('button'); b.textContent=t; b.onclick=()=>{ col.widgets.push(mkWidget(t)); closePicker(); render(); }; g.appendChild(b); });
  document.getElementById('picker').classList.add('open');
}
function closePicker(){ document.getElementById('picker').classList.remove('open'); pickTarget=null; }

/* ── 드래그앤드롭 ──
   위젯 어디서든 떼어내서(removeWidgetAnywhere) 목표 위치에 삽입.
   목표: 컬럼(특정 위젯 앞/끝), top-level(직접 배치). */
let dragWid = null;
function removeWidgetAnywhere(wid){
  // top-level
  const ti = blocks.findIndex(b=>b.id===wid && b.type!=='section');
  if(ti>=0){ return blocks.splice(ti,1)[0]; }
  // nested
  for(const b of blocks){ if(b.type!=='section') continue;
    for(const row of b.rows){ for(const col of row.columns){
      const i = col.widgets.findIndex(w=>w.id===wid);
      if(i>=0) return col.widgets.splice(i,1)[0];
    }}}
  return null;
}
function onWidgetDragStart(e, w){ dragWid = w.id; e.dataTransfer.effectAllowed='move'; e.target.classList.add('dragging'); }
function onWidgetDragEnd(e){ e.target.classList.remove('dragging'); document.querySelectorAll('.dropok,.dropbefore').forEach(el=>el.classList.remove('dropok','dropbefore')); }
function dropIntoColumn(col, beforeWid){
  if(!dragWid) return; const w = removeWidgetAnywhere(dragWid); dragWid=null; if(!w) return;
  if(beforeWid){ const i = col.widgets.findIndex(x=>x.id===beforeWid); col.widgets.splice(Math.max(0,i),0,w); }
  else col.widgets.push(w);
  render();
}
function dropToTopLevel(beforeId){
  if(!dragWid) return; const w = removeWidgetAnywhere(dragWid); dragWid=null; if(!w) return;
  if(beforeId){ const i = blocks.findIndex(b=>b.id===beforeId); blocks.splice(Math.max(0,i),0,w); }
  else blocks.push(w);
  render();
}

/* ── 조작 ── */
function addTopWidget(){ blocks.push(mkWidget('텍스트')); render(); }
function addSection(){ blocks.push(mkSection()); render(); }
function delBlock(bid){ blocks = blocks.filter(b=>b.id!==bid); render(); }
function addRow(sec, cols){ sec.rows.push(mkRow(cols)); render(); }
function delRow(sec, rid){ sec.rows = sec.rows.filter(r=>r.id!==rid); render(); }
function delWidget(col, wid){ col.widgets = col.widgets.filter(w=>w.id!==wid); render(); }

/* 컬럼 수 변경: 명세 D6 — 잘려나가는 컬럼에 위젯 있으면 경고 후 삭제 */
function setCols(row, n){
  if(n < row.cols){
    const lost = row.columns.slice(n).some(c=>c.widgets.length>0);
    if(lost && !confirm(`${row.cols}→${n}열로 줄이면 사라지는 컬럼의 위젯이 삭제됩니다. 계속할까요?`)) return;
    row.columns = row.columns.slice(0,n);
  } else {
    while(row.columns.length < n) row.columns.push(mkColumn());
  }
  row.cols = n; row.colRatios = null; render();
}

/* ── 렌더 ── */
function widgetEl(w, col){
  const d = document.createElement('div'); d.className='widget'; d.draggable = true;
  d.innerHTML = `<span class="tag">${w.type}</span><span class="x">✕</span>위젯`;
  d.querySelector('.x').onclick = ()=>delWidget(col, w.id);
  d.addEventListener('dragstart', e=>{ e.stopPropagation(); onWidgetDragStart(e, w); });
  d.addEventListener('dragend', onWidgetDragEnd);
  // 다른 위젯 위에 떨어뜨리면 그 앞에 삽입 (컬럼 내 위젯일 때만)
  if(col && col.widgets){
    d.addEventListener('dragover', e=>{ if(dragWid && dragWid!==w.id){ e.preventDefault(); e.stopPropagation(); d.classList.add('dropbefore'); } });
    d.addEventListener('dragleave', ()=> d.classList.remove('dropbefore'));
    d.addEventListener('drop', e=>{ e.preventDefault(); e.stopPropagation(); d.classList.remove('dropbefore'); dropIntoColumn(col, w.id); });
  }
  return d;
}
function rowEl(sec, row){
  const wrap = document.createElement('div');
  // 행 도구
  const tools = document.createElement('div'); tools.className='row-tools';
  const lbl = document.createElement('span'); lbl.className='lbl'; lbl.textContent='행 · 열:'; tools.appendChild(lbl);
  const seg = document.createElement('div'); seg.className='seg';
  [1,2,3,4].forEach(n=>{ const b=document.createElement('button'); b.textContent=n; if(n===row.cols)b.className='on'; b.onclick=()=>setCols(row,n); seg.appendChild(b); });
  tools.appendChild(seg);
  const rd = document.createElement('button'); rd.className='plus-col'; rd.style.padding='3px 8px'; rd.textContent='행 삭제'; rd.onclick=()=>delRow(sec,row.id); tools.appendChild(rd);
  wrap.appendChild(tools);

  const r = document.createElement('div'); r.className='row';
  r.style.gridTemplateColumns = row.colRatios ? row.colRatios.map(x=>x+'fr').join(' ') : `repeat(${row.cols}, 1fr)`;
  row.columns.forEach(col=>{
    const c = document.createElement('div'); c.className='col';
    col.widgets.forEach(w=> c.appendChild(widgetEl(w, col)));
    const add = document.createElement('button'); add.className='plus-col'; add.textContent='+ 위젯'; add.onclick=()=>openPicker(col);
    c.appendChild(add);
    // 컬럼 빈 영역에 드롭 → 끝에 추가 (컬럼 간 이동)
    c.addEventListener('dragover', e=>{ if(dragWid){ e.preventDefault(); c.classList.add('dropok'); } });
    c.addEventListener('dragleave', e=>{ if(!c.contains(e.relatedTarget)) c.classList.remove('dropok'); });
    c.addEventListener('drop', e=>{ e.preventDefault(); e.stopPropagation(); c.classList.remove('dropok'); dropIntoColumn(col, null); });
    r.appendChild(c);
  });
  wrap.appendChild(r);
  return wrap;
}
function sectionEl(sec){
  const s = document.createElement('div'); s.className='section'; s.style.background = sec.bgColor;
  const l = document.createElement('div'); l.className='seclabel'; l.textContent='섹션'; s.appendChild(l);
  const del = document.createElement('div'); del.className='secdel'; del.textContent='섹션 삭제'; del.onclick=()=>delBlock(sec.id); s.appendChild(del);
  sec.rows.forEach(row=> s.appendChild(rowEl(sec, row)));
  // 행 추가
  const addWrap = document.createElement('div'); addWrap.style.marginTop='6px';
  [1,2,3,4].forEach(n=>{ const b=document.createElement('button'); b.className='plus-col'; b.style.marginRight='6px'; b.textContent=`+ ${n}열 행`; b.onclick=()=>addRow(sec,n); addWrap.appendChild(b); });
  s.appendChild(addWrap);
  return s;
}
function topLevelWidgetEl(b){
  const t=document.createElement('div'); t.className='toplevel'; t.draggable=true;
  t.innerHTML = `<div class="widget" style="background:#cfd6dd"><span class="tag">${b.type} (직접 배치)</span><span class="x">✕</span>위젯</div>`;
  t.querySelector('.x').onclick=()=>delBlock(b.id);
  t.addEventListener('dragstart', e=>onWidgetDragStart(e, b));
  t.addEventListener('dragend', onWidgetDragEnd);
  // 다른 top-level 항목 위에 드롭 → 그 앞에 삽입
  t.addEventListener('dragover', e=>{ if(dragWid&&dragWid!==b.id){ e.preventDefault(); t.classList.add('dropok'); } });
  t.addEventListener('dragleave', ()=> t.classList.remove('dropok'));
  t.addEventListener('drop', e=>{ e.preventDefault(); e.stopPropagation(); t.classList.remove('dropok'); dropToTopLevel(b.id); });
  return t;
}
function render(){
  const c = document.getElementById('canvas'); c.innerHTML='';
  blocks.forEach(b=>{
    if(b.type==='section'){ c.appendChild(sectionEl(b)); }
    else c.appendChild(topLevelWidgetEl(b));
  });
  // 맨 아래 top-level 드롭존 (섹션 밖으로 빼기)
  const dz = document.createElement('div'); dz.id='toplevelDrop'; dz.textContent='⬇ 여기로 끌어다 놓으면 섹션 밖 "직접 배치" 위젯이 됩니다';
  dz.addEventListener('dragover', e=>{ if(dragWid){ e.preventDefault(); dz.classList.add('dropok'); } });
  dz.addEventListener('dragleave', ()=> dz.classList.remove('dropok'));
  dz.addEventListener('drop', e=>{ e.preventDefault(); dz.classList.remove('dropok'); dropToTopLevel(null); });
  c.appendChild(dz);
  document.getElementById('json').textContent = JSON.stringify(blocks, null, 2);
}
render();
</script>
</body>
</html>
